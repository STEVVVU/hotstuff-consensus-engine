name: Local consensus verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: go test -p 2 -timeout 3m ./...
      - run: go vet -p 2 ./...
      - run: go mod verify
      - run: python -m unittest discover -s tools -p test_verify.py -v
      - run: go build -p 2 -o scratch/hotstuff.exe ./cmd/hotstuff
      - run: go build -p 2 -o scratch/campaign.exe ./cmd/campaign
      - run: python tools/verify.py --hotstuff scratch/hotstuff.exe --campaign scratch/campaign.exe --output scratch/proof
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: consensus-verification
          path: |
            scratch/proof/summary.json
            scratch/proof/campaign/results.json
            scratch/proof/campaign/scenarios.json
            scratch/proof/replay/results.json
            scratch/driver-controls/*.json
